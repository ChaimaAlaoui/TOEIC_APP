<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 100%; max-width: 500px;">
    <h2 class="text-center mb-4" style="font-size: 1.5rem;">Ajouter un étudiant</h2>
    <form (ngSubmit)="addStudent()">
      <!-- Nom, Prénom -->
      <div class="row mb-3">
        <div class="form-group col-md-6">
          <label for="studentLastName">Nom</label>
          <input type="text" class="form-control" id="studentLastName" [(ngModel)]="studentLastName" name="studentLastName" placeholder="Entrez le nom" required>
          <div class="error-message" *ngIf="errors['studentLastName']">{{ errors['studentLastName'] }}</div>
        </div>
        <div class="form-group col-md-6">
          <label for="studentFirstName">Prénom</label>
          <input type="text" class="form-control" id="studentFirstName" [(ngModel)]="studentFirstName" name="studentFirstName" placeholder="Entrez le prénom" required>
          <div class="error-message" *ngIf="errors['studentFirstName']">{{ errors['studentFirstName'] }}</div>
        </div>
      </div>

      <!-- Site -->
      <div class="form-group mb-3">
        <label for="studentSiteId">Site</label>
        <select class="form-control" id="studentSiteId" [(ngModel)]="studentSiteId" name="studentSiteId" required (change)="onSiteChange(studentSiteId)">
          <option value="" disabled selected>Choisissez un site</option>
          <option *ngFor="let site of sites" [value]="site.id">{{ site.nom }}</option>
        </select>
        <div class="error-message" *ngIf="errors['studentSiteId']">{{ errors['studentSiteId'] }}</div>
      </div>

      <!-- Promotion -->
      <div class="form-group mb-3">
        <label for="studentPromotionId">Promotion</label>
        <select class="form-control" id="studentPromotionId" [(ngModel)]="studentPromotionId" name="studentPromotionId" required (change)="onPromotionChange(studentPromotionId)">
          <option value="" disabled selected>Choisissez une promotion</option>
          <option *ngFor="let promo of promotions" [value]="promo.id">{{ promo.nom }}</option>
        </select>
        <div class="error-message" *ngIf="errors['studentPromotionId']">{{ errors['studentPromotionId'] }}</div>
      </div>

      <!-- Semestre Dropdown -->
<div class="form-group mb-3">
  <label for="studentSemestreId">Semestre</label>
  <select class="form-control" id="studentSemestreId" [(ngModel)]="studentSemestreId" name="studentSemestreId" required (change)="onSemestreChange(studentSemestreId)">
    <option value="" disabled selected>Choisissez un semestre</option>
    <option *ngFor="let semestre of semestres" [value]="semestre.id">{{ semestre.nom }}</option>
  </select>
  <div class="error-message" *ngIf="errors['studentSemestreId']">{{ errors['studentSemestreId'] }}</div>
</div>

<!-- Groupe Dropdown -->
<div class="form-group mb-3">
  <label for="studentGroupId">Groupe</label>
  <select class="form-control" id="studentGroupId" [(ngModel)]="studentGroupId" name="studentGroupId" required>
    <option value="" disabled selected>Choisissez un groupe</option>
    <option *ngFor="let groupe of groupes" [value]="groupe.id">{{ groupe.nom }}</option>
  </select>
  <div class="error-message" *ngIf="errors['studentGroupId']">{{ errors['studentGroupId'] }}</div>
</div>

      <!-- Spécialité -->
      <div class="form-group mb-3">
        <label for="studentSpecialite">Spécialité</label>
        <select class="form-control" id="studentSpecialite" [(ngModel)]="studentSpecialite" name="studentSpecialite" required>
          <option value="" disabled selected>Choisissez une spécialité</option>
          <option *ngFor="let specialite of specialites" [value]="specialite">{{ specialite }}</option>
        </select>
        <div class="error-message" *ngIf="errors['studentSpecialite']">{{ errors['studentSpecialite'] }}</div>
      </div>


      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary">Ajouter</button>
        <button type="button" class="btn btn-secondary" [routerLink]="['/studentlist']">Retour</button>
      </div>
    </form>
  </div>
</div>
