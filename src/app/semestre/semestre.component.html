<app-navbar></app-navbar>

<div class="container">
  <h1 class="title">Liste des Semestres</h1>
  
  <!-- Action Row (Search + Add Button) -->
  <div class="action-row">
    <div class="search-bar">
      <input type="text" [(ngModel)]="searchText" placeholder="Rechercher un semestre..." />
    </div>
    <button class="btn btn-add" routerLink="/addsemestre">
      <i class="fas fa-plus"></i> Ajouter un Semestre
    </button>
  </div>
  
  <!-- Table for semestres -->
  <div class="table-container">
    <table class="evaluation-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Promotion</th>
          <th>Site</th>
          <th class="actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let semestre of filteredSemestres" class="evaluation-row">
          <td>{{ semestre.nom }}</td>
          <td>{{ semestre.promotion }}</td>
          <td>{{ semestre.site }}</td>
          <td class="action-buttons">
            <a [routerLink]="['/updatesemestre', semestre.id]" class="btn-icon btn-edit">
              <i class="fas fa-edit"></i>
            </a>
            <button class="btn-icon btn-delete" (click)="deleteSemestre(semestre.id)">
              <i class="fas fa-times"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Pagination -->
  <div class="pagination-controls">
    <div class="pagination-buttons">
      <button class="btn btn-pagination" (click)="previousPage()" [disabled]="currentPage === 1">
        <i class="fas fa-chevron-left"></i> Précédent
      </button>
      <button class="btn btn-pagination" (click)="nextPage()" [disabled]="currentPage === totalPages">
        Suivant <i class="fas fa-chevron-right"></i>
      </button>
    </div>
    <div class="pagination-info">
      Page {{ currentPage }} sur {{ totalPages }}
    </div>
  </div>
</div>
