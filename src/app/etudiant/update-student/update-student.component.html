<app-navbar></app-navbar>

<div class="container my-5">
  <div class="form-card">
    <h1 class="title">Mettre à jour un étudiant</h1>
    
    <form (ngSubmit)="updateStudent()">
      <!-- Nom, Prénom -->
      <div class="row">
        <div class="form-group half">
          <label for="nom">Nom</label>
          <input type="text" class="form-input" id="nom" [(ngModel)]="student.nom" name="nom" placeholder="Entrez le nom" required>
          <div class="error-message" *ngIf="errors['nom']">{{ errors['nom'] }}</div>
        </div>
        <div class="form-group half">
          <label for="prenom">Prénom</label>
          <input type="text" class="form-input" id="prenom" [(ngModel)]="student.prenom" name="prenom" placeholder="Entrez le prénom" required>
          <div class="error-message" *ngIf="errors['prenom']">{{ errors['prenom'] }}</div>
        </div>
      </div>

      <!-- Site -->
      <div class="form-group">
        <label for="site_id">Site</label>
        <select class="form-input" id="site_id" [(ngModel)]="student.site_id" name="site_id" required (change)="onSiteChange(student.site_id)">
          <option value="" disabled selected>Choisissez un site</option>
          <option *ngFor="let site of sites" [value]="site.id" [selected]="site.id === student.site_id">
            {{ site.nom }}
          </option>
        </select>
        <div class="error-message" *ngIf="errors['site_id']">{{ errors['site_id'] }}</div>
      </div>

      <!-- Promotion -->
      <div class="form-group">
        <label for="promotion_id">Promotion</label>
        <select class="form-input" id="promotion_id" [(ngModel)]="student.promotion_id" name="promotion_id" required (change)="onPromotionChange(student.promotion_id)">
          <option value="" disabled selected>Choisissez une promotion</option>
          <option *ngFor="let promo of filteredPromotions" [value]="promo.id" [selected]="promo.id === student.promotion_id">
            {{ promo.nom }}
          </option>
        </select>
        <div class="error-message" *ngIf="errors['promotion_id']">{{ errors['promotion_id'] }}</div>
      </div>

      <!-- Semestre -->
      <div class="form-group">
        <label for="semestre_id">Semestre</label>
        <select class="form-input" id="semestre_id" [(ngModel)]="student.semestre_id" name="semestre_id" required (change)="onSemestreChange(student.semestre_id)">
          <option value="" disabled selected>Choisissez un semestre</option>
          <option *ngFor="let semestre of filteredSemestres" [value]="semestre.id" [selected]="semestre.id === student.semestre_id">
            {{ semestre.nom }}
          </option>
        </select>
        <div class="error-message" *ngIf="errors['semestre_id']">{{ errors['semestre_id'] }}</div>
      </div>

      <!-- Groupe -->
      <div class="form-group">
        <label for="groupe_id">Groupe</label>
        <select class="form-input" id="groupe_id" [(ngModel)]="student.groupe_id" name="groupe_id" required>
          <option value="" disabled selected>Choisissez un groupe</option>
          <option *ngFor="let groupe of filteredGroupes" [value]="groupe.id" [selected]="groupe.id === student.groupe_id">
            {{ groupe.nom }}
          </option>
        </select>
        <div class="error-message" *ngIf="errors['groupe_id']">{{ errors['groupe_id'] }}</div>
      </div>

      <!-- Spécialité -->
      <div class="form-group">
        <label for="specialite">Spécialité</label>
        <select class="form-input" id="specialite" [(ngModel)]="student.specialite" name="specialite" required>
          <option value="" disabled selected>Choisissez une spécialité</option>
          <option *ngFor="let specialite of specialites" [value]="specialite" [selected]="specialite === student.specialite">
            {{ specialite }}
          </option>
        </select>
        <div class="error-message" *ngIf="errors['specialite']">{{ errors['specialite'] }}</div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-update">Mettre à jour</button>
        <button type="button" class="btn btn-return" [routerLink]="['/studentlist']">Retour</button>
      </div>
    </form>
  </div>
</div>
