<!-- impression.component.html -->
<app-navbar></app-navbar>

<div class="container pdf-container">
  <h1 class="title">Feuille de Réponses - Test {{testId}} Groupe {{groupeId}}</h1>
  
  <!-- État de chargement -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
    <p class="mt-3">Génération du PDF en cours...</p>
  </div>
  
  <!-- Affichage du PDF une fois chargé -->
  <div *ngIf="!isLoading && pdfUrl" class="pdf-viewer-container">
    <iframe [src]="pdfUrl" class="pdf-viewer"></iframe>
  </div>
  
  <!-- Message d'erreur si pas de PDF -->
  <div *ngIf="!isLoading && !pdfUrl" class="error-container">
    <div class="alert alert-danger">
      Impossible de charger le PDF. Veuillez réessayer.
    </div>
  </div>
  
  <!-- Boutons d'action -->
  <div class="action-buttons-container">
    <button class="btn btn-print" (click)="printPDF()" [disabled]="isLoading || !pdfUrl">
      <i class="fas fa-print"></i> Imprimer
    </button>
    
    <button class="btn btn-download" (click)="downloadPDF()" [disabled]="isLoading || !pdfUrl">
      <i class="fas fa-download"></i> Télécharger
    </button>
  </div>
</div>
