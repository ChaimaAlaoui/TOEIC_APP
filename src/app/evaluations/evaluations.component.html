<app-navbar></app-navbar>

<div class="container my-5">
  <h1 class="title">Liste des Évaluations</h1>
  
  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Rechercher une évaluation..." />
  </div>

  <!-- Table for filtered evaluations -->
  <div class="table-container">
    <table class="evaluation-table">
      <thead>
        <tr>
          <th>Titre</th>
          <th>Groupe</th>
          <th>Date</th>
          <th>Description</th>
          <th class="actions">Feuilles De Reponse</th>
          <th class="actions">Corriger</th>
          <th class="actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let evaluation of filteredEvaluations" class="evaluation-row">
          <td>{{ evaluation.test_title }}</td>
          <td>{{ evaluation.groupe_name }}</td>
          <td>{{ evaluation.test_date | date: 'yyyy-MM-dd' }}</td>
          <td>{{ evaluation.test_description }}</td>

          <!-- Feuilles De Reponse -->
          <td>
            <button 
              (click)="viewResponseSheet(evaluation.test_id, evaluation.groupe_id)"
              class="btn btn-download"
              [disabled]="loadingButtonId === 'btn-' + evaluation.test_id + '-' + evaluation.groupe_id"
            >
              <span *ngIf="loadingButtonId !== 'btn-' + evaluation.test_id + '-' + evaluation.groupe_id">
                Télécharger la feuille de réponse
              </span>
              <span 
                *ngIf="loadingButtonId === 'btn-' + evaluation.test_id + '-' + evaluation.groupe_id"
                class="spinner-border spinner-border-sm"
                role="status"
                aria-hidden="true">
              </span>
              <span 
                *ngIf="loadingButtonId === 'btn-' + evaluation.test_id + '-' + evaluation.groupe_id"
                class="ms-2">
                Génération en cours...
              </span>
            </button>
          </td>

          <!-- Corriger -->
          <td>
            <button
              class="btn btn-correct"
              [disabled]="!evaluation.feuille_generee"
              (click)="openUploadModal(evaluation)"
            >
              Corriger
            </button>
          </td>

          <!-- Actions -->
          <td class="action-buttons">
            <button class="btn btn-delete" (click)="deleteEvaluation(evaluation.test_id)">Supprimer</button>
            <button class="btn btn-duplicate" (click)="openDuplicateModal(evaluation)">Dupliquer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- BACKDROP Corriger (upload PDF) -->
<div *ngIf="showModal" class="modal-backdrop-blur"></div>

<!-- MODAL Corriger (upload PDF) -->
<div *ngIf="showModal" class="custom-modal">
  <div class="modal-header">
    <h2 class="modal-title">Téléverser Votre Fichier PDF</h2>
    <button type="button" class="close" aria-label="Close" (click)="showModal = false">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form (ngSubmit)="onSubmit(); showModal = false" novalidate>
      <div class="form-group">
        <label for="file">Sélectionnez un fichier PDF</label>
        <input
          type="file"
          class="form-control-file"
          id="file"
          (change)="onFileChange($event)"
          accept=".pdf"
          required
        />
      </div>
      <button 
        type="submit"
        class="btn btn-primary"
        [disabled]="isLoading"
        (click)="uploadPdf(selectedEvaluation.test_id, selectedEvaluation.groupe_id)"
      >
        <span *ngIf="!isLoading">Téléverser</span>
        <span *ngIf="isLoading">Téléversement en cours...</span>
      </button>
    </form>
  </div>
</div>

<!-- BACKDROP Duplication -->
<div *ngIf="showDuplicateModal" class="modal-backdrop-blur"></div>

<!-- MODAL DUPLICATION -->
<div *ngIf="showDuplicateModal" class="custom-modal">
  <div class="modal-header">
    <h2 class="modal-title">Dupliquer le Test</h2>
    <button type="button" class="close" aria-label="Close" (click)="showDuplicateModal = false">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body">
    <form (ngSubmit)="submitDuplicateForm()" #dupForm="ngForm">
      <!-- Nom -->
      <div class="form-group">
        <label>Nom du test</label>
        <input
          type="text"
          [(ngModel)]="duplicateForm.nom"
          name="nom"
          class="form-control"
          required
        />
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Description</label>
        <textarea
          [(ngModel)]="duplicateForm.description"
          name="description"
          class="form-control"
        ></textarea>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label>Date du test</label>
        <input
          type="datetime-local"
          [(ngModel)]="duplicateForm.date"
          name="date"
          class="form-control"
        />
      </div>

      <!-- Site -->
      <div class="form-group">
        <label>Site</label>
        <select
          [(ngModel)]="duplicateForm.site_id"
          name="site_id"
          class="form-control"
        >
          <option [ngValue]="null">--- Choisir un site ---</option>
          <option *ngFor="let s of sites" [value]="s.id">{{ s.nom }}</option>
        </select>
      </div>

      <!-- Promotions -->
      <div class="form-group">
        <label>Promotions</label>
        <select
          [(ngModel)]="duplicateForm.promotions_ids"
          name="promotions_ids"
          class="form-control"
          multiple
        >
          <option *ngFor="let p of promotions" [value]="p.id">{{ p.nom }}</option>
        </select>
      </div>

      <!-- Groupes -->
      <div class="form-group">
        <label>Groupes</label>
        <select
          [(ngModel)]="duplicateForm.groupes_ids"
          name="groupes_ids"
          class="form-control"
          multiple
        >
          <option *ngFor="let g of groupes" [value]="g.id">{{ g.nom }}</option>
        </select>
      </div>

      <!-- Copier le corrigé ? -->
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          id="copyReponsesProf"
          [(ngModel)]="duplicateForm.copyReponsesProf"
          name="copyReponsesProf"
        />
        <label class="form-check-label" for="copyReponsesProf">
          Copier les réponses prof (corrigé) ?
        </label>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Dupliquer</button>
      </div>
    </form>
  </div>
</div>
